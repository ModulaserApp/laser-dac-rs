[package]
name = "etherdream-simulator"
version = "0.1.0"
edition = "2021"
authors = ["Kees Kluskens <kees@kees.im>"]
description = "Ether Dream laser DAC simulator for testing and development"
license = "MIT"
repository = "https://github.com/ModulaserApp/laser-dac-rs"
publish = false

[dependencies]
log = "0.4"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
laser-dac = { path = "../..", default-features = false, features = ["ether-dream", "testutils"] }
